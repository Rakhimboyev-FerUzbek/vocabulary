name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ "main" ]   # branch nomingiz boshqacha bo'lsa (masalan "master"), shu yerni o'zgartiring
  workflow_dispatch:        # bu qator "Actions" tabida qo'lda ham ishga tushirish imkonini beradi

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Pages sozlamalarini tayyorlash
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages hali yoqilmagan bo'lsa, shu parametr avtomatik yoqadi

      - name: src/ papkasini yuklash
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src   # loyihangiz shu papkada joylashgan

      - name: GitHub Pages'ga deploy qilish
        id: deployment
        uses: actions/deploy-pages@v4